<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Agente IA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3efff; display: flex; justify-content: center; min-height: 100vh; align-items: center; margin: 0; }
    .chat-container { width: min(400px, calc(100vw - 32px)); background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(76, 29, 149, 0.14); display: flex; flex-direction: column; overflow: hidden; height: min(500px, calc(100vh - 32px)); }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e9ddff; }
    .message { padding: 10px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
    .user { background: #7c3aed; color: white; align-self: flex-end; }
    .assistant { background: #f1eafe; color: #3b2463; align-self: flex-start; }
    .input-area { display: flex; padding: 10px; background: #fff; }
    .input-area input { flex: 1; min-width: 0; padding: 10px; border: 1px solid #d8c8f5; border-radius: 4px; outline: none; color: #3b2463; }
    .input-area input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.16); }
    .input-area button { padding: 10px 15px; background: #7c3aed; color: white; border: none; border-radius: 4px; margin-left: 5px; cursor: pointer; }
    .input-area button:hover { background: #6d28d9; }
    .loading { display: flex; align-items: center; gap: 5px; min-height: 20px; }
    .loading-dot { width: 7px; height: 7px; border-radius: 50%; background: #8b5cf6; animation: loading-bounce 1s infinite ease-in-out; }
    .loading-dot:nth-child(2) { animation-delay: 0.15s; }
    .loading-dot:nth-child(3) { animation-delay: 0.3s; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes loading-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.55; } 30% { transform: translateY(-5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .loading-dot { animation: none; } }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)" aria-label="Escribe tu mensaje">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
